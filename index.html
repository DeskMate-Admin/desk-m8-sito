<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskM8 — sito in costruzione</title>
<meta name="description" content="DeskM8: sito in costruzione. Per informazioni scrivi a support@desk-m8.com.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --canvas: #e6e6e4;
    --surface: #ececec;
    --text: #3f3f3f;
    --muted: #6f6f6f;
    --plate: #434343;
    --on-plate: #fafafa;
    --raised: 11px 11px 26px rgba(0,0,0,.17), -9px -9px 20px #fff;
    --inset: inset 2px 2px 4px rgba(0,0,0,.13), inset -2px -2px 4px rgba(255,255,255,.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #232323;
      --surface: #2a2a2a;
      --text: #e4e4e4;
      --muted: #a3a3a3;
      --plate: #e4e4e4;
      --on-plate: #232323;
      --raised: 11px 11px 26px rgba(0,0,0,.45), -9px -9px 20px rgba(255,255,255,.04);
      --inset: inset 2px 2px 4px rgba(0,0,0,.4), inset -2px -2px 4px rgba(255,255,255,.04);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--canvas);
    color: var(--text);
    font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 440px;
    padding: 48px 32px;
    border-radius: 30px;
    background: var(--surface);
    box-shadow: var(--raised);
    text-align: center;
  }
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: -0.01em;
    line-height: 1;
    margin: 0;
  }
  .wordmark span {
    margin-left: 2px;
    padding: 3px 10px 6px;
    border-radius: 5px;
    background: var(--plate);
    color: var(--on-plate);
  }
  p { margin: 28px 0 0; font-size: 17px; line-height: 1.5; color: var(--muted); }
  a.mail {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 20px;
    border-radius: 12px;
    box-shadow: var(--inset);
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
  }
  a.mail:hover, a.mail:focus-visible { text-decoration: underline; }
  a.mail:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1 class="wordmark" aria-label="DeskM8">DESK<span>M8</span></h1>
  <p>Sito in costruzione.</p>
  <a class="mail" href="mailto:support@desk-m8.com">support@desk-m8.com</a>
</main>
</body>
</html>
